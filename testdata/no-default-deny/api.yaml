apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: edge
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/api:1.0
---
# This policy selects the api pods for both directions, so the workload is
# covered -- but because its podSelector is not empty, the namespace still has
# no default-deny and a new, unlabeled workload would be wide open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: edge
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db
