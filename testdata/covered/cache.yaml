apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: data
spec:
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:7
---
# A default-deny-all policy: empty podSelector covers every pod in the
# namespace, and with no ingress/egress rules it both provides ingress
# default-deny and counts as egress coverage.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
