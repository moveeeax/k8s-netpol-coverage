name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...
      - name: smoke test the CLI
        run: |
          go build -o k8s-netpol-coverage .
          ./k8s-netpol-coverage audit examples/k8s
          set +e
          ./k8s-netpol-coverage audit examples/k8s --fail-on high
          code=$?
          set -e
          test "$code" -eq 3
          ./k8s-netpol-coverage trace examples/k8s --from shop/storefront --to shop/orders-db --port 5432
          set +e
          ./k8s-netpol-coverage trace examples/k8s --from shop/orders-db --to shop/storefront --port 8080
          code=$?
          set -e
          test "$code" -eq 2
